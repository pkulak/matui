name: Cachix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: pkulak
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#matui --print-build-logs
